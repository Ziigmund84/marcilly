<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration | Golf de Marcilly</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=18">
</head>
<body>
<!-- Connexion -->
<section class="login" id="login" hidden>
  <div class="login__card">
    <div class="login__logo" aria-hidden="true"></div>
    <h1 id="login-title">Espace admin</h1>
    <p id="login-sub">Connectez-vous pour mettre à jour le site du Golf de Marcilly.</p>
    <form id="login-form">
      <div class="field"><label for="l-email">E-mail</label><input type="email" id="l-email" autocomplete="username" required></div>
      <div class="field" id="pw-field"><label for="l-pass">Mot de passe</label><input type="password" id="l-pass" autocomplete="current-password" required></div>
      <div class="status" id="login-status" hidden></div>
      <button class="btn btn--red" type="submit" id="login-btn">Se connecter</button>
      <button class="linkbtn" type="button" id="forgot-btn">Mot de passe oublié ?</button>
      <a class="linkbtn" href="../index.html">Retour au site</a>
    </form>
    <form id="newpw-form" hidden>
      <div class="field"><label for="n-pass">Nouveau mot de passe</label><input type="password" id="n-pass" minlength="8" autocomplete="new-password" required><small>8 caractères minimum</small></div>
      <div class="status" id="newpw-status" hidden></div>
      <button class="btn btn--red" type="submit">Enregistrer le mot de passe</button>
    </form>
  </div>
</section>

<!-- Application -->
<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Rubriques">
    <div class="side__brand"><i aria-hidden="true"></i><span>Golf de Marcilly<small>Administration</small></span></div>
    <nav id="side-nav"></nav>
    <div class="side__foot">
      <a href="../index.html" target="_blank" rel="noopener">Voir le site</a>
      <span id="who"></span>
      <button class="btn btn--ghost btn--sm" id="logout" style="color:#fff;border-color:rgba(255,255,255,.4)">Se déconnecter</button>
    </div>
  </aside>
  <div>
    <div class="mobilebar"><strong>Admin Marcilly</strong><button id="menu-btn" aria-controls="side" aria-expanded="false">Menu</button></div>
    <main class="main" id="main"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js?v=18"></script>
<script src="admin.js?v=18"></script>
</body>
</html>
